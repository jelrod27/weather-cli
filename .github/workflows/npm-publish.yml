name: NPM Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version_check.outputs.should_publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Run tests
        run: npm run lint && npm run test:ci
        env:
          CI: true

      # Packing may execute prepare even with npm 10's --ignore-scripts flag.
      # Keep every dependency/lifecycle execution in this unprivileged job.
      - name: Pack validated package
        run: |
          mkdir -p "$RUNNER_TEMP/weather-package"
          npm pack --pack-destination "$RUNNER_TEMP/weather-package"

      - name: Check if version matches release tag
        id: version_check
        run: |
          PACKAGE_VERSION=$(tar -xOf "$RUNNER_TEMP/weather-package/"*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          if [ "v$PACKAGE_VERSION" = "$RELEASE_TAG" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Save validated package
        if: steps.version_check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-package
          path: ${{ runner.temp }}/weather-package/*.tgz
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weather-package
          path: ${{ runner.temp }}/weather-package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          registry-url: 'https://registry.npmjs.org'

      # Publishing a tarball avoids directory packing and prepare entirely.
      # Do not install dependencies or run lifecycle scripts with OIDC.
      - name: Publish to NPM
        run: npm publish "$RUNNER_TEMP/weather-package/"*.tgz --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: true
