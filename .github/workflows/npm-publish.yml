name: NPM Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Retain all pending releases instead of replacing the pending run on each merge.
concurrency:
  group: npm-publish
  queue: max

jobs:
  validate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      validation_attempt: ${{ steps.release.outputs.validation_attempt }}
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      - name: Plan release and update build version
        id: release
        run: |
          node scripts/prepare-release.js --write
          echo "validation_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Validate the versioned package
        if: steps.release.outputs.should_publish == 'true'
        run: npm run lint && npm run test:ci
        env:
          CI: true

      # Dependency and lifecycle execution stays in this unprivileged job.
      - name: Pack validated package
        if: steps.release.outputs.should_publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/weather-package"
          npm pack --pack-destination "$RUNNER_TEMP/weather-package"

      - name: Save validated package
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weather-package
          path: ${{ runner.temp }}/weather-package/*.tgz
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: weather-package
          path: ${{ runner.temp }}/weather-package

      # Node 24 supplies npm >= 11.5.1, required for npm trusted publishing.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No checkout, dependency installs, lifecycle execution, or long-lived token.
      - name: Publish to npm using trusted publishing
        # workflow_run's default GITHUB_SHA may be newer than the validated source.
        run: |
          if [ "$VALIDATION_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::Re-run all jobs so release version and ordering are validated for this attempt."
            exit 1
          fi
          GITHUB_SHA="$SOURCE_SHA" npm publish "$RUNNER_TEMP/weather-package/"*.tgz --ignore-scripts --provenance --access public --tag "$DIST_TAG"
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
          VALIDATION_ATTEMPT: ${{ needs.validate.outputs.validation_attempt }}
          CI: true

  release:
    needs: [validate, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          TAG="v$VERSION"
          TAG_COUNT=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")
          if [ "$TAG_COUNT" != 0 ]; then
            TAG_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
          fi
          # Recheck live ancestry on failed-job-only retries as well as fresh runs.
          LATEST_SHA=$(curl --fail --silent --show-error https://registry.npmjs.org/weather-cli-16bit/latest | jq -er '.gitHead | select(test("^[a-f0-9]{40}$"))')
          COMPARE=$(gh api "repos/$GH_REPO/compare/$LATEST_SHA...$SOURCE_SHA" --jq .status)
          IS_LATEST=false
          if [ "$COMPARE" = ahead ] || [ "$COMPARE" = identical ]; then IS_LATEST=true; fi
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "$TAG" --generate-notes --latest="$IS_LATEST"
          fi
          echo "Published weather-cli-16bit@$VERSION from $SOURCE_SHA; latest=$IS_LATEST" >> "$GITHUB_STEP_SUMMARY"
