# Gitleaks configuration for weather-cli-16bit
# https://github.com/gitleaks/gitleaks

title = "weather-cli-16bit secret scanning rules"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

# Custom rules for project-specific secrets
[[rules]]
id = "sentry-auth-token"
description = "Sentry Authentication Token"
regex = '''sntryu_[a-zA-Z0-9]{64}'''
keywords = ["sntryu_"]

[[rules]]
id = "sentry-system-token"
description = "Sentry System Token"
regex = '''sntrys_[a-zA-Z0-9]{64}'''
keywords = ["sntrys_"]

[[rules]]
id = "openweather-api-key"
description = "OpenWeatherMap API Key"
regex = '''[a-f0-9]{32}'''
keywords = ["openweather", "appid"]
entropy = 3.5

[[rules]]
id = "open-meteo-api-key"
description = "Open-Meteo API Key"
regex = '''[a-f0-9]{32}'''
keywords = ["openmeteo", "open-meteo"]
entropy = 3.5

# Allowlist - paths and patterns to ignore
[[allowlists]]
description = "Global allowlist — example files, dependencies, and generated artifacts"
paths = [
    '''\.env\.example$''',
    '''\.env\.local\.example$''',
    '''node_modules/''',
    '''\.next/''',
    '''test-results/''',
    '''playwright-report/''',
]

# Specific strings to ignore (placeholder values, not real secrets)
[[allowlists]]
description = "Documented placeholder values"
regexes = [
    '''your_[a-z_]+_here''',
    '''test-api-key''',
    '''DEMO_KEY''',
    '''YOUR_GITHUB_TOKEN''',
]

# Historical findings, reviewed 2026-08-26. All three are placeholders or a
# credential that no longer authenticates:
#   6e32af7 .env WEATHER_API_KEY   - OpenWeatherMap key, verified dead (HTTP 401);
#                                    the project moved to Open-Meteo, which needs no key
#   50265b4 GITHUB_REPO_UPDATE.md  - literal "YOUR_GITHUB_TOKEN" placeholder in a curl example
#   c9d4382 test/weather-api.test.js - literal "test-api-key" fixture
# Kept allowlisted so CI stays green on history; do not add entries here without
# recording what was found and how it was resolved.
[[allowlists]]
description = "Reviewed historical commits"
commits = [
    "6e32af7c8e4c7b5bf6d29abcc312294d579fda12",
    "50265b4966638024418e512bdaa7181870021dc2",
    "c9d4382ee5751b9923fe4efc43aad1feffb4eeab",
    "304594e",
    "4d045f2",
    "16680d1",
]

# Note: package-lock.json is deliberately not allowlisted here. The upstream
# default config already skips lock files for entropy noise, and a local
# allowlist would additionally hide registry credentials (_auth, _authToken)
# committed into it.
